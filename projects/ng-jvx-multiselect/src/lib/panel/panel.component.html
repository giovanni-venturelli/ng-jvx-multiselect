<ng-template cdkConnectedOverlay
             [cdkConnectedOverlayOrigin]="origin()"
             [cdkConnectedOverlayOpen]="attached()"
             [cdkConnectedOverlayPositions]="positions"
             [cdkConnectedOverlayWidth]="width() || ''"
             [cdkConnectedOverlayMinWidth]="112"
             [cdkConnectedOverlayPanelClass]="panelClasses()"
             [cdkConnectedOverlayHasBackdrop]="true"
             [cdkConnectedOverlayBackdropClass]="'ng-jvx-panel-overlay'"
             [cdkConnectedOverlayDisposeOnNavigation]="true"
             (backdropClick)="closeRequest.emit()"
             (detach)="onDetach()"
             (overlayKeydown)="onKeydown($event)"
             (positionChange)="onPositionChange($event)">
  <div class="ng-jvx-panel"
       [class.below-panel]="position() === 'below'"
       [class.above-panel]="position() === 'above'"
       [class.opening]="state() === 'opening' || state() === 'open'"
       [class.closing]="state() === 'closing'">
    <ng-content></ng-content>
  </div>
</ng-template>
