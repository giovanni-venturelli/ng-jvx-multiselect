<div class="layout">
  <nav class="sidebar" [attr.aria-label]="txt.examples">
    <a class="brand" href="#top">
      <strong>ng-jvx-multiselect</strong>
      <span>demo</span>
    </a>

    <div class="lang-switch" role="group" [attr.aria-label]="txt.language">
      @for (l of langs; track l.code) {
        <button type="button" [class.active]="l.code === lang" [attr.aria-pressed]="l.code === lang"
                [attr.lang]="l.code" (click)="changeLang(l.code)">{{ l.label }}</button>
      }
    </div>

    @for (group of nav; track group.title) {
      <div class="nav-group">
        <h3>{{ group.title }}</h3>
        <ul>
          @for (link of group.links; track link.anchor) {
            <li><a [href]="'#' + link.anchor">{{ link.label }}</a></li>
          }
        </ul>
      </div>
    }
  </nav>

  <main id="top">
    <header class="intro">
      <h1>ng-jvx-multiselect</h1>
      <p [innerHTML]="txt.intro"></p>
    </header>

    <app-basic-example/>
    <app-multi-example/>
    <app-custom-keys-example/>
    <app-client-search-example/>
    <app-templates-example/>
    <app-groups-example/>
    <app-remote-get-example/>
    <app-remote-post-example/>
    <app-remote-mapping-example/>
    <app-remote-list-example/>
    <app-forms-example/>
    <app-events-example/>
    <app-theming-example/>
  </main>
</div>

<app-log-panel/>
